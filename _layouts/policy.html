---
layout: default
---

<div class="privacy-page">
  <header class="page-header">
    <div class="container">
      <h1>{{ page.title }}</h1>
      <p class="page-subtitle">Effective {{ page.effective | date: '%B %-d, %Y' }}{% if page.last_updated and page.last_updated != page.effective %} · Last updated {{ page.last_updated | date: '%B %-d, %Y' }}{% endif %}</p>
    </div>
  </header>

  <section class="privacy-content">
    <div class="container">
      <div class="privacy-layout">
        {% include toc-sidebar.html items=page.toc_items %}

        <div class="privacy-main policy-text">
          {{ content }}
        </div>
      </div>
    </div>
  </section>
</div>
