# Site settings
title: Airship Games
description: >-
  Airship Games makes small games in the open and builds them with their players.
  Play free in your browser, share ideas and vote on what we build next.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://airshipgames.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
permalink: pretty

# Sass settings
sass:
  style: compressed
  sass_dir: _sass

# Collections for games
collections:
  games:
    output: true
    permalink: /games/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      image: /assets/images/social-default.jpg
  - scope:
      path: ""
      type: "games"
    values:
      layout: "game"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - scripts
  - LICENSE
  - vendor

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
